# ==========================================================
# Employee Management System - Application Configuration
# ==========================================================

spring.application.name=employee-management-app

# ---------- Server ----------
server.port=8080

# ---------- MySQL DataSource ----------
# Update these to match your local MySQL setup.
# Use the existing schema: CREATE DATABASE employee_management;
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# 'update' auto-creates/updates tables from the entities - convenient for
# a learning project. Use Flyway/Liquibase migrations in real production apps.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null

# ---------- Static resources (front-end) ----------
spring.web.resources.static-locations=classpath:/static/

# ---------- Logging ----------
logging.level.com.company.ems=INFO
logging.level.org.hibernate.SQL=DEBUG
